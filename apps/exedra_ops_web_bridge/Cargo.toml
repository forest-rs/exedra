[package]
name = "exedra_ops_web_bridge"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasm bridge for deterministic Exedra Ops scenario execution"
readme = "README.md"
keywords = ["mesh", "modeling", "wasm", "demo"]
categories = ["graphics", "wasm"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
exedra_assembly.workspace = true
exedra_constructive.workspace = true
exedra_mesh = { features = ["libm"], workspace = true }
exedra_ops = { features = ["libm"], workspace = true }
exedra_primitives = { features = ["libm"], workspace = true }
serde = { default-features = false, features = ["alloc", "derive"], version = "1.0.228" }
serde_json = { default-features = false, features = ["alloc"], version = "1.0.145" }
wasm-bindgen.workspace = true

[lints]
workspace = true
