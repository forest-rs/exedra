[package]
name = "constructive_wind_tunnel"
default-run = "constructive_wind_tunnel"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Wind-tunnel scenarios for constructive recipe evaluation"
readme = "README.md"
keywords = ["benchmark", "geometry"]
categories = ["development-tools::profiling"]
publish = false

[lints]
workspace = true

[dependencies]
exedra_analytic = { features = ["std"], workspace = true }
exedra_assembly = { features = ["serde"], workspace = true }
exedra_compile = { features = ["std"], workspace = true }
exedra_constructive = { features = ["std"], workspace = true }
exedra_curves.workspace = true
exedra_math.workspace = true
exedra_mesh = { features = ["std"], workspace = true }
exedra_mesh_ops = { features = ["libm", "std"], workspace = true }
exedra_testkit = { features = ["std"], workspace = true }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
exedra_authoring_web_bridge = { path = "../../apps/exedra_authoring_web_bridge" }
