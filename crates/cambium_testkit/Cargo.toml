[package]
name = "cambium_testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Golden snapshots and debug dump utilities for Cambium"
keywords = ["mesh", "test", "golden", "snapshot"]
categories = ["development-tools::testing"]
readme = "README.md"

[features]
default = ["std"]
libm = ["cambium/libm"]
std = ["cambium/std"]

[dev-dependencies]
cambium.workspace = true
exedra.workspace = true
exedra_primitives = { workspace = true, features = ["std"] }

[lints]
workspace = true
