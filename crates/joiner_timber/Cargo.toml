[package]
name = "joiner_timber"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Timber fitting rules for the joiner construction layer"
readme = "README.md"
keywords = ["construction", "joinery", "timber", "no_std"]
categories = ["graphics", "data-structures"]

[lints]
workspace = true

[features]
default = ["std"]
std = ["exedra_constructive/std", "exedra_math/std", "joiner/std"]

[dependencies]
exedra_constructive.workspace = true
exedra_math = { features = ["libm"], workspace = true }
exedra_measurements.workspace = true
joiner.workspace = true
