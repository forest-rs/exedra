[package]
name = "cambium"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Operator and growth layer for the exedra mesh kernel"
keywords = ["mesh", "modeling", "operators", "no_std"]
categories = ["data-structures", "algorithms"]

[dependencies]
exedra = { features = ["std"], workspace = true }
libm = { optional = true, workspace = true }
understory_dirty.workspace = true

[features]
default = ["std"]
libm = ["dep:libm", "exedra/libm"]
std = ["exedra/std"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[dev-dependencies]
cambium_testkit.workspace = true

[lints]
workspace = true
