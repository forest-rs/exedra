[package]
name = "exedra_isosurface"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Implicit-field evaluation and surface extraction seams for exedra"
keywords = ["implicit", "isosurface", "sdf", "no_std"]
categories = ["data-structures", "algorithms"]

[dependencies]
exedra_math.workspace = true
exedra_mesh.workspace = true
exedra_qef.workspace = true
exedra_spatial = { default-features = false, path = "../exedra_spatial" }
hashbrown.workspace = true
libm = { optional = true, workspace = true }

[features]
default = ["std"]
libm = ["dep:libm", "exedra_mesh/libm", "exedra_math/libm", "exedra_qef/libm"]
std = ["exedra_mesh/std", "exedra_math/std", "exedra_qef/std"]

[lints]
workspace = true
