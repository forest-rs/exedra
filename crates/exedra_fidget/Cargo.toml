[package]
name = "exedra_fidget"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fidget expression-field adapter for Exedra implicit surfaces"
keywords = ["implicit", "fidget", "isosurface", "sdf"]
categories = ["graphics", "algorithms"]

[dependencies]
exedra_isosurface = { features = ["std"], workspace = true }
fidget.workspace = true

[dev-dependencies]
exedra_mesh = { features = ["std"], workspace = true }

[features]
default = ["std"]
jit = ["fidget/jit"]
std = ["exedra_isosurface/std"]

[lints]
workspace = true
