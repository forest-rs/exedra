[package]
name = "exedra_analytic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Retained analytic geometry, shared boundary topology and explicit mesh realization for Exedra"
keywords = ["geometry", "analytic", "tessellation", "no_std"]
categories = ["data-structures", "algorithms"]

[dependencies]
exedra_math.workspace = true
exedra_mesh.workspace = true
exedra_profile.workspace = true
exedra_triangulate.workspace = true
# Non-optional by design: realization trig always routes through libm, so
# meshes are bit-identical across platforms and backends.
libm.workspace = true

[features]
default = ["std"]
libm = ["exedra_mesh/libm", "exedra_math/libm"]
std = ["exedra_mesh/std", "exedra_math/std"]

[lints]
workspace = true
