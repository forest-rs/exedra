[package]
name = "exedra_analytic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Planar analytic topology spike for Exedra"
keywords = ["geometry", "analytic", "tessellation", "no_std"]
categories = ["data-structures", "algorithms"]

[dependencies]
exedra = { default-features = false, path = "../exedra" }
exedra_math.workspace = true
exedra_triangulate.workspace = true
libm = { optional = true, workspace = true }

[features]
default = ["std"]
libm = ["dep:libm", "exedra/libm", "exedra_math/libm"]
std = ["exedra/std", "exedra_math/std"]

[lints]
workspace = true
