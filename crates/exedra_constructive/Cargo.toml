[package]
name = "exedra_constructive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Constructive geometry head: immutable recipe IR with deterministic tessellation into Exedra meshes"
readme = "README.md"
keywords = ["geometry", "cad", "recipe", "no_std"]
categories = ["graphics", "data-structures"]

[lints]
workspace = true

[features]
default = ["std"]
# The JSON interchange surface for external frontends. Implies std: the
# interchange is a host-side format, and the workspace serde dependency is
# std-flavored. Core evaluation stays serde-free.
serde = ["dep:serde", "std"]
std = ["exedra_mesh/std", "exedra_math/std"]

[dependencies]
exedra_math = { features = ["libm"], workspace = true }
exedra_mesh = { features = ["libm"], workspace = true }
# Explicit libm opts primitive coordinates into the deterministic backend even
# when another workspace consumer enables exedra_primitives/std.
exedra_primitives = { features = ["libm"], workspace = true }
exedra_triangulate.workspace = true
hashbrown.workspace = true
kurbo.workspace = true
# Non-optional by design: evaluation trig always routes through libm, even in
# std builds, so results are bit-identical across platforms and backends.
libm.workspace = true
serde = { optional = true, workspace = true }

[dev-dependencies]
exedra_testkit = { features = ["std"], workspace = true }
serde_json.workspace = true
