[package]
name = "exedra_ops_testkit"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Golden snapshots and debug dump utilities for Exedra Ops"
keywords = ["mesh", "test", "golden", "snapshot"]
categories = ["development-tools::testing"]
readme = "README.md"

[features]
default = ["std"]
libm = ["exedra_ops/libm"]
std = ["exedra_ops/std"]

[dev-dependencies]
exedra_mesh.workspace = true
exedra_ops.workspace = true
exedra_primitives = { features = ["std"], workspace = true }

[lints]
workspace = true
