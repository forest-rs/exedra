[package]
name = "exedra_primitives"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic mesh primitive generators for Exedra"
keywords = ["mesh", "primitives", "geometry", "no_std"]
categories = ["data-structures", "algorithms"]

[dependencies]
exedra_mesh.workspace = true
libm = { optional = true, workspace = true }

[features]
default = ["std"]
libm = ["dep:libm", "exedra_mesh/libm"]
std = ["exedra_mesh/std"]

[lints]
workspace = true
