[package]
name = "exedra_gltf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "glTF 2.0 export from compiled geometry and caller-owned structure"
readme = "README.md"
keywords = ["geometry", "gltf", "export"]
categories = ["graphics"]

[lints]
workspace = true

[dependencies]
exedra_compile = { features = ["std"], workspace = true }
exedra_constructive = { features = ["std"], workspace = true }
exedra_math = { features = ["std"], workspace = true }
exedra_mesh = { features = ["libm", "std"], workspace = true }
serde_json.workspace = true
