[package]
name = "exedra_compile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Scene-independent geometry compilation, extraction and retained queries"
readme = "README.md"
keywords = ["geometry", "mesh", "modeling", "no_std"]
categories = ["graphics", "data-structures"]

[lints]
workspace = true

[features]
default = ["std"]
std = ["exedra_analytic/std", "exedra_constructive/std", "exedra_mesh/std", "exedra_mesh_ops/std"]

[dependencies]
exedra_analytic = { features = ["libm"], workspace = true }
exedra_constructive.workspace = true
exedra_math = { features = ["libm"], workspace = true }
exedra_mesh = { features = ["libm"], workspace = true }
exedra_mesh_ops.workspace = true
exedra_profile.workspace = true
hashbrown.workspace = true
