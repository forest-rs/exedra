[package]
name = "exedra_testkit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic fixtures, golden snapshots, and debug dumps for Exedra"
keywords = ["mesh", "test", "golden", "snapshot"]
categories = ["development-tools::testing"]
readme = "README.md"

[features]
default = ["std"]
libm = ["exedra/libm", "exedra_primitives/libm"]
std = ["exedra/std", "exedra_primitives/std"]

[dependencies]
exedra = { workspace = true }
exedra_primitives = { workspace = true }

[lints]
workspace = true
