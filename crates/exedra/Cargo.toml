[package]
name = "exedra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Application-facing facade for the Exedra modeling suite"
readme = "README.md"
keywords = ["geometry", "modeling", "mesh", "no_std"]
categories = ["graphics", "data-structures"]

[features]
# The common geometry surface: recipes, independent compilation and direct mesh operations. Structure is opt-in.
default = ["std", "compile", "mesh_ops"]

# Numeric backends. At least one must be selected.
std = [
    "exedra_mesh/std",
    "exedra_mesh_ops?/std",
    "exedra_analytic?/std",
    "exedra_step?/std",
    "exedra_scene?/std",
    "exedra_assembly?/std",
    "exedra_constructive?/std",
    "exedra_compile?/std",
    "exedra_implicit?/std",
    "exedra_isosurface?/std",
    "exedra_edit?/std",
    "exedra_primitives?/std",
]
libm = [
    "exedra_mesh/libm",
    "exedra_mesh_ops?/libm",
    "exedra_analytic?/libm",
    "exedra_step?/libm",
    "exedra_implicit?/libm",
    "exedra_isosurface?/libm",
    "exedra_edit?/libm",
    "exedra_primitives?/libm",
]

# Application-facing domain namespaces.
analytic = ["dep:exedra_analytic", "dep:exedra_curves"]
assembly = ["dep:exedra_assembly", "compile"]
constructive = ["dep:exedra_constructive", "dep:exedra_curves"]
compile = ["dep:exedra_compile", "constructive"]
scene = ["dep:exedra_scene", "compile"]
gltf = ["dep:exedra_gltf", "compile", "exedra_assembly?/gltf", "std"]
step = ["dep:exedra_step", "analytic"]
implicit = ["dep:exedra_implicit"]
isosurface = ["dep:exedra_isosurface", "implicit"]
edit = ["dep:exedra_edit"]
mesh_ops = ["dep:exedra_mesh_ops"]
primitives = ["dep:exedra_primitives"]
serde = [
    "constructive",
    "exedra_assembly?/serde",
    "exedra_constructive/serde",
    "std",
]

[dependencies]
exedra_analytic = { optional = true, workspace = true }
exedra_assembly = { optional = true, workspace = true }
exedra_compile = { optional = true, workspace = true }
exedra_constructive = { optional = true, workspace = true }
exedra_curves = { optional = true, workspace = true }
exedra_edit = { optional = true, workspace = true }
exedra_gltf = { optional = true, workspace = true }
exedra_implicit = { optional = true, workspace = true }
exedra_isosurface = { optional = true, workspace = true }
exedra_mesh.workspace = true
exedra_mesh_ops = { optional = true, workspace = true }
exedra_primitives = { optional = true, workspace = true }
exedra_scene = { optional = true, workspace = true }
exedra_step = { optional = true, workspace = true }

[lints]
workspace = true
