[package]
name = "exedra_curves"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic curves for Exedra: cubic, Hermite and rational B-spline evaluation, sampling, frames, sweeps, arc length and realization plans, and exact line and arc 2D profiles"
readme = "README.md"
keywords = ["curves", "nurbs", "profile", "no_std", "geometry"]
categories = ["graphics", "mathematics", "no-std"]

[lints]
workspace = true

[features]
default = ["std"]
# The arithmetic backend of `exedra_math`: square roots through the
# standard library, or through `libm` for `no_std` builds. Ring angles use
# `exedra_math`'s trigonometry, which prefers `libm` when it is enabled.
libm = ["exedra_math/libm"]
std = ["exedra_math/std"]

[dependencies]
exedra_math.workspace = true
# Non-optional by design: profile sampling trig always routes through libm,
# so counts and points are bit-identical across platforms and backends.
libm.workspace = true
