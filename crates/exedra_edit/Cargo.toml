[package]
name = "exedra_edit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Mesh command execution, preview and reporting for Exedra"
keywords = ["mesh", "modeling", "operators", "no_std"]
categories = ["data-structures", "algorithms"]

[dependencies]
exedra_mesh.workspace = true
exedra_mesh_ops = { features = ["libm"], workspace = true }
invalidation.workspace = true

[features]
# This crate supplies mesh command execution. Geometry users call mesh ops directly.
default = ["std"]
libm = ["exedra_mesh/libm", "exedra_mesh_ops/libm"]
std = ["exedra_mesh/std", "exedra_mesh_ops/std"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[dev-dependencies]
exedra_constructive.workspace = true
exedra_edit_testkit.workspace = true
exedra_testkit = { features = ["std"], workspace = true }

[lints]
workspace = true
