[workspace]
resolver = "2"
members = [
    "apps/cambium_web_bridge",
    "benchmarks/constructive_wind_tunnel",
    "benchmarks/exedra_fidget_bench",
    "benchmarks/exedra_qef_bench",
    "benchmarks/exedra_render_bench",
    "benchmarks/exedra_wind_tunnel",
    "crates/cambium",
    "crates/cambium_testkit",
    "crates/exedra",
    "crates/exedra_analytic",
    "crates/exedra_assembly",
    "crates/exedra_constructive",
    "crates/exedra_fidget",
    "crates/exedra_isosurface",
    "crates/exedra_primitives",
    "crates/exedra_qef",
    "crates/exedra_spatial",
    "crates/exedra_testkit",
    "crates/exedra_triangulate",
    "examples/constructive_gallery",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/forest-rs/exedra"

[workspace.lints]
# LINEBENDER LINT SET - Cargo.toml - v8
# See https://linebender.org/wiki/canonical-lints/
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.cast_possible_wrap = "warn"
clippy.collection_is_never_read = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.default_trait_access = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

# Prefer using `#[expect(...)]` instead of `#[allow(...)]`.
# `#[expect(...)]` warns when the suppressed lint no longer fires.
clippy.allow_attributes = "warn"

rust.unsafe_code = "deny"

[workspace.dependencies]
cambium = { default-features = false, path = "crates/cambium" }
cambium_testkit = { default-features = false, path = "crates/cambium_testkit" }
exedra = { default-features = false, path = "crates/exedra" }
exedra_analytic = { default-features = false, path = "crates/exedra_analytic" }
exedra_assembly = { default-features = false, path = "crates/exedra_assembly" }
exedra_constructive = { default-features = false, path = "crates/exedra_constructive" }
exedra_fidget = { default-features = false, path = "crates/exedra_fidget" }
exedra_isosurface = { default-features = false, path = "crates/exedra_isosurface" }
exedra_primitives = { default-features = false, path = "crates/exedra_primitives" }
exedra_qef = { default-features = false, path = "crates/exedra_qef" }
exedra_spatial = { default-features = false, path = "crates/exedra_spatial" }
exedra_testkit = { default-features = false, path = "crates/exedra_testkit" }
exedra_triangulate = { default-features = false, path = "crates/exedra_triangulate" }
fidget = { default-features = false, version = "0.4.2" }
hashbrown = { default-features = false, features = ["default-hasher"], version = "0.16.1" }
invalidation = "0.2.0"
# Pinned exactly: kurbo flattening output feeds content hashes and goldens in
# the constructive domain; version bumps must be deliberate (EVAL_SCHEMA_VERSION).
kurbo = { default-features = false, features = ["libm"], version = "=0.13.1" }
libm = "0.2.15"
serde = { features = ["derive"], version = "1.0.228" }
# float_roundtrip is required for correctness, not comfort: interchange
# formats promise that serialized f64 values re-parse to identical bits, and
# serde_json's default parser is shortest-print but lossy-parse.
serde_json = { features = ["float_roundtrip"], version = "1.0.145" }
wasm-bindgen = "0.2.104"
web-time = "1.1.0"
